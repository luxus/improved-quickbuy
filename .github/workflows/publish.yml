name: publish
# On a version tag (vX.Y.Z): check that the tag, CHANGELOG.md, the DMM listing and the stored VPK agree,
# put the DMM source and the VPK on the gh-pages branch (served by GitHub Pages), and create the GitHub
# release as a DRAFT with the VPK attached and the CHANGELOG.md section as its notes (published by hand).
# The VPK is stored base64-encoded in release/ and must match release/*.sha256 and the DMM listing.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      V: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Tag, changelog and listing agree
        run: |
          v=${V#v}; echo "VERSION=$v" >> "$GITHUB_ENV"
          grep -q "^## \[$v\] - " CHANGELOG.md
          node -e 'const m=require("./site/mods/improved-quickbuy.json").release; const v=process.argv[1]; if (m.version!==v || m.artifacts[0].filename!==`improved-quickbuy-${v}.vpk`) { console.error("listing is", m.version); process.exit(1) }' "$v"
      - name: Decode and verify the VPK
        run: |
          mkdir -p site/files
          base64 -d release/improved-quickbuy-$VERSION.vpk.b64 > site/files/improved-quickbuy-$VERSION.vpk
          (cd site/files && sha256sum -c ../../release/improved-quickbuy-$VERSION.vpk.sha256)
          node -e 'const a=require("./site/mods/improved-quickbuy.json").release.artifacts[0]; const s=require("fs").statSync("site/files/"+a.filename).size; const h=require("crypto").createHash("sha256").update(require("fs").readFileSync("site/files/"+a.filename)).digest("hex"); if (s!==a.size||h!==a.hashes.sha256) { console.error("listing size/hash differ", s, h); process.exit(1) }'
      - name: Validate the DMM source with DMM's own checker
        run: |
          curl -fsSL https://raw.githubusercontent.com/deadlock-mod-manager/deadlock-mod-manager/main/examples/mod-source/check.mjs -o /tmp/check.mjs
          node /tmp/check.mjs site
      - name: Release notes from CHANGELOG.md
        run: sh tools/changelog.sh notes "$VERSION" > /tmp/notes.md && cat /tmp/notes.md
      - name: Update gh-pages (no force)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages && git worktree add /tmp/pages origin/gh-pages && cd /tmp/pages && git checkout -B gh-pages
          else
            git worktree add --detach /tmp/pages && cd /tmp/pages && git checkout --orphan gh-pages
          fi
          git rm -rq . 2>/dev/null || true
          cp -a "$GITHUB_WORKSPACE/site/." .
          git add -A
          git diff --cached --quiet || git commit -qm "chore(pages): DMM source for $V"
          git push origin gh-pages
      - name: Draft the GitHub release with the VPK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$V" >/dev/null 2>&1; then echo "release $V exists, left as is"; exit 0; fi
          gh release create "$V" --draft --verify-tag --title "Improved Quickbuy $V" \
            --notes-file /tmp/notes.md "site/files/improved-quickbuy-$VERSION.vpk"
