# git-cliff config: turns Conventional Commits since the last tag into a Keep a Changelog section.
# Used by tools/changelog.sh; not needed in CI. https://git-cliff.org/docs/configuration
[changelog]
header = ""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d", timezone="Europe/Zurich") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} (**breaking**){% endif %}
{% endfor %}\
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
# Keep a Changelog groups; the HTML comments only fix the order.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^perf", group = "<!-- 1 -->Changed" },
  { message = "^fix", group = "<!-- 3 -->Fixed" },
  { message = "^revert", group = "<!-- 2 -->Removed" },
  { body = ".*security", group = "<!-- 4 -->Security" },
  { message = "^(refactor|docs|chore|test|ci|build|style)", skip = true },
]
